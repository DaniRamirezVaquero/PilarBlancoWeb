<div class="house bg-page relative isolate w-full page-top pb-24 lg:pb-36 px-8 sm:px-16 lg:px-32 xl:px-64"
  [class.lights-down]="lightsDown()">
  <!-- Sala: la misma capa que el reel de la home. Solo cambia de opacidad mientras suena la pantalla y se ve. -->
  <div class="house-lights" aria-hidden="true"></div>

  <div class="house-content">
    <div>
      <h1 class="page-title">Vídeo</h1>
      <span class="page-title-dash" aria-hidden="true"></span>
    </div>

    <section class="screen" aria-labelledby="screen-title">
      <!-- Las bandas panorámicas viven en el padding: su espacio está siempre reservado. -->
      <div #screen class="screen-bands">
        <!-- Un reproductor por vídeo: al cambiar de cartel se destruye el anterior y nace el nuevo. -->
        @for (video of [current()]; track video.videoId) {
          <app-vimeo-facade [videoId]="video.videoId" [hash]="video.hash" [fallbackPoster]="video.fallbackPoster"
            [title]="video.title" [priority]="true" [startLoaded]="autoplay()"
            sizes="(min-width: 1280px) min(58rem, 100vw), (min-width: 1024px) calc(100vw - 16rem), (min-width: 640px) calc(100vw - 8rem), calc(100vw - 4rem)" />
        }
      </div>
      <p id="screen-title" class="screen-caption">
        <span class="screen-kicker">Ahora en pantalla</span>{{ ' ' }}<span class="screen-name">{{ current().label }}</span>
      </p>
    </section>

    <section class="cartel" aria-labelledby="cartel-title">
      <h2 id="cartel-title" class="page-title cartel-title">En cartel</h2>
      <span class="page-title-dash mb-8" aria-hidden="true"></span>
      <app-poster-wall [videos]="billboard" [current]="current().videoId" (choose)="show($event)" />
    </section>
  </div>
</div>
