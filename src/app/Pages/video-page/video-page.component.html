<div
  class="bg-gradient-to-tr from-zinc-400 via-neutral-500 to-neutral-600 w-screen pt-24 lg:pt-36 px-8 sm:px-16 lg:px-32 xl:px-64">
  <div class="pb-8 w-full flex flex-col gap-6 md:gap-8 lg:gap-16">

    <div class="flex flex-col gap-4 sm:gap-6 md:gap-8">
      <div>
        <h1 class="lato-regular text-xl sm:text-2xl md:text-4xl text-white">Reel 2026</h1>
        <div class="w-full h-0.5 rounded-full bg-orange-500 mt-2"></div>
      </div>
      <section class="w-full flex justify-center">
        <div class="shadow-md w-full ">
          <div class="relative pb-[56.25%] h-0 overflow-hidden">
            <iframe title="Reel 2026 de actuación de Pilar Blanco - Video principal"
              src="https://player.vimeo.com/video/1208363473?h=3205afba43"
              class="absolute top-0 left-0 z-10 w-full h-full" frameborder="0"
              referrerpolicy="strict-origin-when-cross-origin"
              allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
              allowfullscreen loading="lazy"></iframe>
          </div>
        </div>
      </section>
    </div>

    <div class="flex flex-col gap-4 sm:gap-6 md:gap-8">
      <section class="w-full grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 lg:gap-20 lg:mb-12"
        aria-label="Videobook Express, reel y escena de Pilar Blanco">

        <div *ngFor="let scene of scenes" [hidden]="!scene.visible" class="w-full max-w-[1280px]">
          <h2 class="lato-regular text-lg sm:text-xl md:text-2xl text-white mb-3">{{ scene.projectName }}</h2>
          <div class="w-full h-0.5 rounded-full bg-orange-500 mb-4"></div>
          <div class="shadow-md w-full">
            <div class="relative pb-[56.25%] h-0 overflow-hidden">
              <iframe [title]="scene.title"
                [src]="getSafeUrl(scene.videoId, scene.hash)"
                class="absolute top-0 left-0 z-10 w-full h-full" frameborder="0"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                allowfullscreen loading="lazy"></iframe>
            </div>
          </div>
        </div>

      </section>
    </div>
  </div>
</div>
