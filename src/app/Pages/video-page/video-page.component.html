<div class="bg-page w-full page-top pb-24 lg:pb-36 px-8 sm:px-16 lg:px-32 xl:px-64">
  <div class="w-full flex flex-col gap-12 lg:gap-16">

    <div>
      <h1 class="page-title">Vídeo</h1>
      <span class="page-title-dash" aria-hidden="true"></span>
    </div>

    <section class="w-full" aria-labelledby="reel-title">
      <h2 id="reel-title" class="section-title mb-3">{{ reel.label }}</h2>
      <div class="shadow-md w-full">
        <app-vimeo-facade [videoId]="reel.videoId" [hash]="reel.hash" [fallbackPoster]="reel.fallbackPoster"
          [title]="reel.title" [priority]="true" sizes="100vw" />
      </div>
    </section>

    <section class="w-full grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-x-20 lg:gap-y-16"
      aria-label="Videobook Express, reel y escena de Pilar Blanco">

      @for (scene of scenes; track scene.videoId) {
        <!-- Con un número impar de escenas, la última ocupa las dos columnas. -->
        <div class="w-full max-w-[1280px] scene-anchor lg:[&:last-child:nth-child(odd)]:col-span-2"
          [attr.id]="sceneSlug(scene)">
          <h2 class="section-title mb-3">{{ scene.label }}</h2>
          <div class="shadow-md w-full">
            <app-vimeo-facade [videoId]="scene.videoId" [hash]="scene.hash" [fallbackPoster]="scene.fallbackPoster"
              [title]="scene.title" />
          </div>
        </div>
      }

    </section>
  </div>
</div>
