<div class="page">
  <header class="head head-row">
    <h1 class="title-xl">Fotos</h1>
    <a [href]="photosZip" download="Pilar Blanco - Galeria fotos.zip" class="btn-main"
      aria-label="Descargar el book fotográfico de Pilar Blanco en calidad completa (zip)">
      Descargar las fotos <app-icon name="download"></app-icon>
    </a>
  </header>

  <section aria-labelledby="book-title">
    <h2 id="book-title" class="sub-title mb-[calc(var(--step)*1.25)]">Book</h2>
    <app-photo-book [frames]="book"></app-photo-book>
  </section>

  <section class="mt-[calc(var(--step)*4.5)]" aria-labelledby="proyectos-title">
    <h2 id="proyectos-title" class="sub-title mb-[calc(var(--step)*1.25)]">Fotogramas de proyectos</h2>
    <app-photo-book [frames]="projects" layout="wall" sizes="(min-width: 1024px) 30vw, (min-width: 640px) 46vw, 92vw"></app-photo-book>
  </section>
</div>
