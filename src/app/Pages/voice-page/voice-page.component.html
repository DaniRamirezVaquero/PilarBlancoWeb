<div
  class="bg-page pt-32 md:pt-28 lg:pt-36 pb-24 lg:pb-36 px-8 sm:px-16 lg:px-32 xl:px-64 overflow-x-hidden">
  <div class="flex flex-col gap-8">
    <div>
      <div class="mb-6">
        <h1 class="page-title">Doblaje y locución</h1>
        <span class="page-title-dash" aria-hidden="true"></span>
      </div>
      <h2 class="section-title voice-heading mb-5">Doblaje</h2>
      <div class="w-full grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 lg:gap-20 lg:mb-12">

        @for (v of dubbing; track v.videoId) {
          <div class="shadow-md w-full">
            <app-vimeo-facade [videoId]="v.videoId" [hash]="v.hash" [fallbackPoster]="v.fallbackPoster"
              [title]="v.title" [priority]="$index === 0" />
          </div>
        }

      </div>
    </div>

    <div>
      <div class="mb-6">
        <h2 class="section-title voice-heading">Locución</h2>
      </div>
      <app-voice-strip class="draw" [demos]="voice"></app-voice-strip>
    </div>
  </div>
</div>
