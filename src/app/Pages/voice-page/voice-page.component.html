<div class="page">
  <header class="head">
    <h1 class="title-xl">Voz</h1>
  </header>

  <section aria-labelledby="locucion-title">
    <h2 id="locucion-title" class="sub-title mb-[calc(var(--step)*1.25)]">Locución</h2>
    <app-voice-strip [demos]="voice"></app-voice-strip>
  </section>

  <section class="mt-[calc(var(--step)*4)]" aria-labelledby="doblaje-title">
    <h2 id="doblaje-title" class="sub-title mb-[calc(var(--step)*1.25)]">Doblaje</h2>
    <div class="grid gap-[calc(var(--step)*1.75)] lg:grid-cols-2">
      @for (demo of dubbing; track demo.videoId; let first = $first) {
        <figure class="m-0">
          <div class="print">
            <app-vimeo-facade [videoId]="demo.videoId" [hash]="demo.hash" [poster]="demo.poster" [title]="demo.title" [priority]="first" />
          </div>
          <figcaption class="mt-4 font-display text-xl font-light">{{ demo.label }}</figcaption>
        </figure>
      }
    </div>
  </section>
</div>
