<div class="sheet" [class.is-vertical]="layout === 'vertical'" [style.--per]="perStrip" [style.--aspect]="aspect">
  @for (strip of strips; track $index) {
    <div class="film strip" [class.film-h]="layout === 'sheet'" [class.film-v]="layout === 'vertical'">
      <ul class="frames">
        @for (item of strip; track item.frame.code + item.index) {
          <li class="frame">
            <div class="frame-shot">
              <button type="button" class="frame-btn"
                [attr.aria-label]="'Ampliar ' + item.frame.code + ': ' + item.frame.alt"
                (click)="open(item.index, $event.currentTarget)"
                (pointermove)="onPointerMove($event, item.frame)" (pointerleave)="hideLoupe()">
                <img [src]="item.frame.src" [attr.srcset]="item.frame.srcset ?? null" [attr.sizes]="item.frame.srcset ? sizes : null"
                  alt="" [attr.loading]="eager ? 'eager' : 'lazy'" decoding="async" draggable="false"
                  [style.object-position]="item.frame.position ?? null" />
              </button>
              @if (chosen === item.index) {
                <app-pencil-ring [delay]="ringDelay"></app-pencil-ring>
              }
            </div>
            <p class="edge-code frame-code">
              <span>{{ item.frame.code }}</span>
              <span class="frame-caption">{{ item.frame.caption || edgeLabel }}</span>
            </p>
          </li>
        }
      </ul>
    </div>
  }
</div>

<div #loupe class="loupe" aria-hidden="true"></div>

<dialog #dialog class="enlargement" aria-label="Ampliación del fotograma"
  (close)="onDialogClose()" (click)="onDialogClick($event)" (keydown)="onDialogKey($event)">
  @if (frames[current()]; as frame) {
    <figure class="enlargement-print print">
      <img [src]="frame.full" [alt]="frame.alt" decoding="async" />
      <figcaption class="enlargement-caption">
        <span class="edge-code"><b>{{ frame.code }}</b> {{ frame.caption || edgeLabel }}</span>
        <span class="edge-code text-ink-soft">{{ current() + 1 }} / {{ frames.length }}</span>
      </figcaption>
    </figure>
    <div class="enlargement-controls">
      <button type="button" class="ctrl" (click)="step(-1)" aria-label="Fotograma anterior">
        <app-icon name="chevron-left"></app-icon>
      </button>
      <button type="button" class="ctrl" (click)="step(1)" aria-label="Fotograma siguiente">
        <app-icon name="chevron-right"></app-icon>
      </button>
      <button type="button" class="ctrl ctrl-close" (click)="close()" aria-label="Cerrar ampliación">
        <app-icon name="xmark"></app-icon>
      </button>
    </div>
  }
</dialog>
