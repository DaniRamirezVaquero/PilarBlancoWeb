<dialog #dialog class="viewer" aria-label="Book de Pilar Blanco a pantalla completa"
  (cancel)="onCancel($event)" (close)="onDialogClose()" (keydown)="onKeydown($event)">
  <p class="sr-only" aria-live="polite">{{ announcement() }}</p>

  <div class="viewer-bar">
    <span class="viewer-counter" aria-hidden="true">{{ counter() }}</span>
    <button type="button" class="viewer-btn viewer-close" (click)="close()" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
  </div>

  <div class="viewer-stage" (click)="onStageClick($event)"
    (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)" (pointercancel)="onPointerCancel()">
    <button type="button" class="viewer-btn viewer-prev" (click)="previous()" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 4l-8 8 8 8" /></svg>
    </button>
    @if (photo(); as current) {
      <img #image class="viewer-img" [src]="current.src" [srcset]="current.srcset" [alt]="current.alt" width="720" height="1280"
        sizes="(min-aspect-ratio: 9/16) 50vh, 100vw" decoding="async" draggable="false" />
    }
    <button type="button" class="viewer-btn viewer-next" (click)="next()" aria-label="Foto siguiente">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4l8 8-8 8" /></svg>
    </button>
  </div>
</dialog>
