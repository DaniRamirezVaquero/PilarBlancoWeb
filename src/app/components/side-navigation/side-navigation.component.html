<app-burguer-menu-btn class="top-8 left-8 w-16 sm:top-8 sm:left-8 md:top-12 md:left-10 lg:w-20 z-50"
  (click)="toggleSideNav()" [ngClass]="isOpen ? 'fixed' : 'absolute'" />

<aside id="sideNav" class="fixed z-40 top-0 -left-[460px] w-[460px] h-dvh 
       glass-effect
       border-r-2 border-gradient-to-b from-sky-300/50 to-orange-500/50
       flex lg:items-center transition-all duration-700 ease-out">
  
  <!-- Efecto de partículas sutil -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-sky-300 rounded-full animate-pulse"></div>
    <div class="absolute top-1/2 right-1/3 w-1 h-1 bg-orange-400 rounded-full animate-pulse animation-delay-200"></div>
    <div class="absolute bottom-1/3 left-1/2 w-1.5 h-1.5 bg-sky-400 rounded-full animate-pulse animation-delay-400"></div>
  </div>
  
  <div class="relative z-10 flex flex-col gap-y-6 md:gap-y-8 xl:gap-y-10 text-xl md:text-2xl lg:text-3xl 
              lato-regular ml-16 text-zinc-900 mt-24 md:mt-28 lg:mt-0">
    
    <a href="#" [routerLink]="['/home']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      Inicio
    </a>
    
    <a href="#" [routerLink]="['/video']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      Videos
    </a>
    
    <a href="#" [routerLink]="['/gallery']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      Galería
    </a>
    
    <a href="#" [routerLink]="['/voice']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      Voz
    </a>
    
    <a href="#" [routerLink]="['/bio']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      Trayectoria
    </a>
    
    <a href="#" [routerLink]="['/curriculum']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      CV
    </a>
    
    <a href="#" [routerLink]="['/contact']" routerLinkActive="text-orange-500 font-bold" (click)="toggleSideNav()"
      class="hover:text-primary transition-all duration-300 
             hover:drop-shadow-lg hover:scale-105 transform">
      Contacto
    </a>

  </div>
</aside>
