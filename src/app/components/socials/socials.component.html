<div class="flex items-center gap-4">
  <a href="https://www.instagram.com/pilarblanco.actriz/" target="_blank" rel="noopener noreferrer me"
     aria-label="Instagram de Pilar Blanco, actriz"
     class="group relative w-12 h-12 flex items-center justify-center rounded-full
            glass-effect hover:scale-110 transition-all duration-300">
    <app-icon name="instagram" size="lg" class="text-white group-hover:text-pink-400
              transition-all duration-300 drop-shadow-lg"></app-icon>

    <!-- Efecto de brillo en hover -->
    <div class="absolute inset-0 rounded-full bg-gradient-to-r from-pink-400/0 via-pink-400/20 to-pink-400/0
                opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
  </a>

  <a href="https://vimeo.com/user18148957" target="_blank" rel="noopener noreferrer me"
     aria-label="Vimeo de Pilar Blanco, actriz"
     class="group relative w-12 h-12 flex items-center justify-center rounded-full
            glass-effect hover:scale-110 transition-all duration-300">
    <app-icon name="vimeo-v" size="lg" class="text-white group-hover:text-info
              transition-all duration-300 drop-shadow-lg"></app-icon>

    <!-- Efecto de brillo en hover -->
    <div class="absolute inset-0 rounded-full bg-gradient-to-r from-info/0 via-info/20 to-info/0
                opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
  </a>

  <a href="mailto:pilarblanco.actriz@gmail.com"
     aria-label="Enviar un email a Pilar Blanco, actriz"
     class="group relative w-12 h-12 flex items-center justify-center rounded-full
            glass-effect hover:scale-110 transition-all duration-300">
    <app-icon name="envelope" size="lg" class="text-white group-hover:text-accent
              transition-all duration-300 drop-shadow-lg"></app-icon>

    <!-- Efecto de brillo en hover -->
    <div class="absolute inset-0 rounded-full bg-gradient-to-r from-accent/0 via-accent/20 to-accent/0
                opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
