<div class="relative pb-[56.25%] h-0 overflow-hidden bg-navy">
  @if (!loaded()) {
    <button type="button" class="group absolute inset-0 z-10 h-full w-full cursor-pointer"
      [attr.aria-label]="'Reproducir ' + title" (click)="load()">
      <img [src]="poster" alt="" class="absolute inset-0 h-full w-full object-cover transition-[filter] duration-500 group-hover:brightness-110"
        [attr.loading]="priority ? 'eager' : 'lazy'"
        [attr.fetchpriority]="priority ? 'high' : 'low'"
        decoding="async" />
      <span class="absolute inset-0 bg-gradient-to-t from-black/45 via-transparent to-transparent"></span>
      <span class="absolute left-4 bottom-4 sm:left-6 sm:bottom-6 flex items-center gap-3 text-white">
        <span class="flex h-14 w-14 sm:h-16 sm:w-16 items-center justify-center rounded-full bg-accent text-white
                     transition-transform duration-300 group-hover:scale-110">
          <app-icon name="play" class="text-xl translate-x-[2px]"></app-icon>
        </span>
        <span class="note text-white">Reproducir</span>
      </span>
    </button>
  } @else {
    <iframe [title]="title" [src]="safeUrl"
      class="absolute top-0 left-0 z-10 h-full w-full" frameborder="0"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      allowfullscreen></iframe>
  }
</div>
