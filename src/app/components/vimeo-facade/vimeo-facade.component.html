<div class="relative pb-[56.25%] h-0 overflow-hidden bg-silk">
  @if (!loaded()) {
    <button type="button" class="group absolute inset-0 z-10 h-full w-full cursor-pointer"
      [attr.aria-label]="'Reproducir ' + title" (click)="load()">
      <img [src]="poster" alt="" class="absolute inset-0 h-full w-full object-cover transition-[filter] duration-700 brightness-[0.85] group-hover:brightness-100"
        [attr.loading]="priority ? 'eager' : 'lazy'"
        [attr.fetchpriority]="priority ? 'high' : 'low'"
        decoding="async" />
      <span class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent"></span>
      <span class="absolute left-4 bottom-4 sm:left-7 sm:bottom-7 flex items-center gap-4 text-platinum">
        <span class="flex h-14 w-14 sm:h-16 sm:w-16 items-center justify-center rounded-full bg-orange text-ink
                     shadow-[0_14px_30px_-14px_rgb(0_0_0/0.8)] transition-transform duration-500 group-hover:scale-105">
          <app-icon name="play" class="text-lg translate-x-[2px]"></app-icon>
        </span>
        <span class="label">Reproducir</span>
      </span>
    </button>
  } @else {
    <iframe [title]="title" [src]="safeUrl"
      class="absolute top-0 left-0 z-10 h-full w-full" frameborder="0"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
      allowfullscreen></iframe>
  }
</div>
