<div #root class="relative">
  <button type="button" (click)="toggle()"
    [attr.aria-expanded]="open()" aria-haspopup="dialog" aria-controls="contact-card"
    [attr.aria-label]="variant === 'compact' ? 'Contacto' : null"
    [attr.title]="variant === 'compact' ? 'Contacto' : null"
    [class]="variant === 'compact' ? 'contact-icon' : 'btn-line contact-trigger'">
    <app-icon name="envelope"></app-icon>
    @if (variant === 'full') {
      <span>Contacto</span>
    }
  </button>

  @if (open()) {
    <div id="contact-card" role="dialog" aria-label="Contacto directo con Pilar Blanco"
      class="contact-card print" [class.align-left]="align === 'left'">
      <p class="note text-ink-soft">Contacto directo</p>
      <div class="mt-3 flex items-center gap-2">
        <p class="contact-address select-all" [attr.title]="email">{{ email }}</p>
        <button type="button" (click)="copyEmail()" class="contact-copy"
          [attr.aria-label]="copied() ? 'Correo copiado' : 'Copiar correo'">
          <app-icon [name]="copied() ? 'check' : 'copy'"></app-icon>
        </button>
      </div>
      <p class="contact-status" aria-live="polite">
        @if (copied()) { Copiado al portapapeles }
        @if (copyFailed()) { No se pudo copiar: selecciona la dirección }
      </p>
      <div class="mt-3 grid gap-2">
        <a [href]="gmailComposeUrl" target="_blank" rel="noopener noreferrer" (click)="close()" class="btn-primary justify-center">
          Escribir en Gmail
        </a>
        <a [href]="mailtoUrl" (click)="close()" class="btn-line justify-center">Abrir mi correo</a>
      </div>
      <div class="contact-socials">
        <a [href]="instagram" target="_blank" rel="noopener noreferrer me" class="link-quiet">
          <app-icon name="instagram"></app-icon> Instagram
        </a>
        <a [href]="vimeo" target="_blank" rel="noopener noreferrer me" class="link-quiet">
          <app-icon name="vimeo-v"></app-icon> Vimeo
        </a>
      </div>
    </div>
  }
</div>
