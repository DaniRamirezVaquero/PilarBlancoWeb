<ul class="voice-list">
  @for (demo of demos; track demo.url; let i = $index) {
    <li class="voice" [class.is-active]="active() === i">
      <button type="button" class="voice-play"
        (click)="toggle(i)" [attr.aria-pressed]="playing() === i"
        [attr.aria-label]="(playing() === i ? 'Pausar ' : 'Escuchar ') + 'demo de voz: ' + demo.label">
        <app-icon [name]="playing() === i ? 'pause' : 'play'"></app-icon>
      </button>

      <div class="voice-meta">
        <span class="voice-label">{{ demo.label }}</span>
        <span class="note voice-time">
          @if (failed() === i) { No se pudo cargar } @else if (loading() && active() === i) { Cargando… } @else { {{ elapsed(i, demo) }} }
        </span>
      </div>

      <div class="voice-track" role="slider" tabindex="0"
        [attr.aria-label]="'Posición en ' + demo.label"
        aria-valuemin="0" aria-valuemax="100"
        [attr.aria-valuenow]="active() === i ? percent() : 0"
        [attr.aria-valuetext]="elapsed(i, demo)"
        (click)="seek($event, i)" (keydown)="onKeySeek($event, i)">
        <svg viewBox="0 0 384 48" preserveAspectRatio="none" aria-hidden="true" focusable="false">
          <defs>
            <clipPath [attr.id]="'played-' + i">
              <rect x="0" y="0" height="48" [attr.width]="active() === i ? progress() * 384 : 0" />
            </clipPath>
          </defs>
          <g class="bars">
            @for (bar of barsOf[i]; track bar.x) {
              <rect [attr.x]="bar.x" [attr.y]="24 - bar.h / 2" width="2.4" [attr.height]="bar.h" />
            }
          </g>
          <g class="bars-played" [attr.clip-path]="'url(#played-' + i + ')'">
            @for (bar of barsOf[i]; track bar.x) {
              <rect [attr.x]="bar.x" [attr.y]="24 - bar.h / 2" width="2.4" [attr.height]="bar.h" />
            }
          </g>
        </svg>
      </div>
    </li>
  }
</ul>
