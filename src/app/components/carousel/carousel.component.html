<div class="flex flex-col items-center relative" role="region" aria-roledescription="carrusel"
  aria-label="Book fotográfico de Pilar Blanco" (keydown.arrowleft)="prev()" (keydown.arrowright)="next()">
  <!-- Anuncio de la foto actual para lectores de pantalla (el aria-live sobre las fotos no era fiable). -->
  <p class="sr-only" aria-live="polite" aria-atomic="true">Foto {{ realPosition }} de {{ photoCount }}</p>
  <div class="relative w-full md:w-2/3 lg:w-1/3 xl:w-2/5 2xl:w-2/6 h-full ">
    <div class="flex motion-reduce:!transition-none" [class.carousel-snap]="!enableTransition"
      [class.transition-transform]="enableTransition" [class.duration-500]="enableTransition"
      [style.transform]="'translateX(-' + currentIndex * 100 + '%)'">
      <div *ngFor="let image of slides; let i = index; trackBy: trackSlide"
        class="flex-shrink-0 w-full h-full relative" [attr.aria-hidden]="i === currentIndex ? null : 'true'">
        <img [src]="image.src" [srcset]="image.srcset"
          sizes="(min-width: 1536px) 33vw, (min-width: 1280px) 40vw, (min-width: 1024px) 33vw, (min-width: 768px) 67vw, 100vw"
          [alt]="image.alt"
          class="object-cover w-full h-full aspect-foto rounded transition-all duration-200 motion-reduce:transition-none relative"
          [attr.loading]="i === 1 ? 'eager' : 'lazy'" [attr.fetchpriority]="i === 1 ? 'high' : null" decoding="async"
          width="720" height="1280" [class.opacity-100]="i === currentIndex"
          [class.opacity-50]="i === currentIndex - 1 || i === currentIndex + 1"
          [class.opacity-0]="i < currentIndex - 1 || i > currentIndex + 1" [class.translate-y-0]="i === currentIndex"
          [class.translate-y-20]="i === currentIndex - 1 || i === currentIndex + 1"
          [class.scale-90]="i === currentIndex - 1 || i === currentIndex + 1" [class.z-20]="i === currentIndex"
          [class.z-10]="i === currentIndex - 1 || i === currentIndex + 1"
          [class.z-0]="i < currentIndex - 1 || i > currentIndex + 1" [class.-translate-x-20]="i === currentIndex + 1"
          [class.translate-x-20]="i === currentIndex - 1" [class.shadow-xl]="i === currentIndex">
      </div>
    </div>
  </div>

  <!-- Controles bajo la foto: nada tapa las fotos y todo queda en una sola barra. -->
  <div class="carousel-controls">
    <div class="flex items-center gap-3">
      <button type="button" (click)="prev()" class="carousel-btn" aria-label="Foto anterior del book de Pilar Blanco">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M15.25 5.5 8.75 12l6.5 6.5" />
        </svg>
      </button>

      <button type="button" class="carousel-btn" (click)="toggleAutoplay()"
        [attr.aria-label]="isPlaying ? 'Pausar book fotográfico' : 'Reproducir book fotográfico'">
        @if (isPlaying) {
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="is-solid">
          <rect x="7" y="6" width="3.5" height="12" />
          <rect x="13.5" y="6" width="3.5" height="12" />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="is-solid">
          <path d="M7.6 5.5 18.1 12 7.6 18.5Z" />
        </svg>
        }
      </button>

      <button type="button" (click)="next()" class="carousel-btn" aria-label="Foto siguiente del book de Pilar Blanco">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M8.75 5.5 15.25 12l-6.5 6.5" />
        </svg>
      </button>
    </div>

    <a class="btn-line" [href]="photosZip" download="Pilar Blanco - Galeria fotos.zip">
      <span>Descargar fotos</span>
      <app-icon name="download" size="lg"></app-icon>
    </a>
  </div>
</div>
