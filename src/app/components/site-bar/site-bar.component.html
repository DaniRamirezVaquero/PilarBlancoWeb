<header class="bar">
  <a class="sr-only-focusable skip" href="#contenido">Saltar al contenido</a>

  <a routerLink="/home" class="wordmark" (click)="closeMenu()" aria-label="Pilar Blanco, actriz. Inicio">
    <span class="type-display">Pilar Blanco</span>
    <span class="edge-code text-ink-soft">Actriz</span>
  </a>

  <nav class="nav" aria-label="Secciones">
    @for (item of nav; track item.link) {
      <a [routerLink]="item.link" routerLinkActive="is-active" class="nav-link">
        <span class="edge-code nav-code">{{ item.code }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="actions">
    <a [href]="cvUrl" download="CV de Pilar Blanco.pdf" class="cv-link"
      aria-label="Descargar el currículum de Pilar Blanco en PDF">
      <span class="cv-link-label">CV</span>
      <app-icon class="cv-link-desktop" name="download"></app-icon>
      <app-icon class="cv-link-mobile" name="file-arrow-down"></app-icon>
    </a>
    <app-contact-menu class="hidden sm:block"></app-contact-menu>
    <app-contact-menu class="sm:hidden" variant="compact"></app-contact-menu>
    <button type="button" class="menu-btn lg:hidden" (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()" aria-controls="menu-movil"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
      <app-icon [name]="menuOpen() ? 'xmark' : 'bars'"></app-icon>
    </button>
  </div>
</header>

@if (menuOpen()) {
  <div id="menu-movil" class="sheet-menu lg:hidden">
    <nav aria-label="Secciones">
      <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
        class="sheet-link" (click)="closeMenu()">
        <span class="edge-code">01A</span><span>Inicio</span>
      </a>
      @for (item of nav; track item.link) {
        <a [routerLink]="item.link" routerLinkActive="is-active" class="sheet-link" (click)="closeMenu()">
          <span class="edge-code">{{ item.code }}</span><span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
}
