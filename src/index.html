    html, body {
      margin: 0;

    }
    app-root {
      display: block;
      min-height: 100dvh;
      opacity: 0;
    }
    app-root.app-ready {
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    @media (scripting: none) {
      app-root { opacity: 1; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      var covers = ['fondo2', 'portada'];
      var themes = { fondo2: 'mytheme', portada: 'mytheme-portada' };
      var index = Math.floor(Date.now() / (30 * 60 * 1000)) % covers.length;
      document.documentElement.setAttribute('data-theme', themes[covers[index]]);

      // Solo /home pinta el hero: en cualquier otra ruta no precargamos nada.
      if (location.pathname !== '/' && location.pathname !== '/home') {
        return;
      }
      var key = covers[index];
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.type = 'image/webp';
      link.href = 'assets/images/hero/' + key + '-1920.webp';
      link.imageSrcset = [
        'assets/images/hero/' + key + '-960.webp 960w',
        'assets/images/hero/' + key + '-1920.webp 1920w',
        'assets/images/hero/' + key + '-3200.webp 3200w'
      ].join(', ');
      link.imageSizes = '100vw';
      document.head.appendChild(link);
    })();
  </script>
</head>
